<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Treasure Generator</title>
    <style>
        :root {
            --bg: #1a1a24;
            --panel: #252533;
            --accent: #e6b422;
            --text: #e0e0e0;
            --text-dim: #a0a0b0;
            --border: #3a3a4a;
            --gold: #d4af37;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--panel);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid var(--border);
        }
        h1 { margin: 0 0 20px; color: var(--gold); text-align: center; }
        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        label { font-weight: 500; min-width: 120px; }
        select, input[type="number"] {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            flex: 1;
            min-width: 100px;
        }
        button {
            background: var(--accent);
            color: #111;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .output {
            background: #111;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            min-height: 100px;
        }
        .hidden { display: none; }
        .coin { color: #a0d4ff; }
        .gem { color: #ff7eb3; }
        .art { color: #7ebaff; }
        .magic { color: #b2ff7e; }
        .rarity { color: #e6b422; font-weight: bold; }
        .section { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border); }
        .summary { font-size: 1.1em; margin-bottom: 10px; color: var(--gold); font-weight: bold; }
        .line { margin: 4px 0; }
        
        /* Back Button Styling */
        .back-btn {
            display: inline-block;
            background: var(--text-dim);
            color: var(--bg);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
            text-align: center;
        }
        .back-btn:hover {
            background: var(--accent);
            color: #111;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📜 Treasure Generator</h1>
    <div class="controls">
        <div class="row">
            <label>Treasure Type:</label>
            <select id="treasureType">
                <option value="individual">Individual Treasure</option>
                <option value="hoard">Treasure Hoard</option>
            </select>
        </div>
        <div class="row" id="individualControls">
            <label>Number of Individuals:</label>
            <input type="number" id="indCount" min="1" max="50" value="1">
            <label>Challenge Rating (CR):</label>
            <select id="indCR">
                <option value="0-4">CR 0-4</option>
                <option value="5-10">CR 5-10</option>
                <option value="11-16">CR 11-16</option>
                <option value="17+">CR 17+</option>
            </select>
        </div>
        <div class="row hidden" id="hoardControls">
            <label>Challenge Rating (CR):</label>
            <select id="hoardCR">
                <option value="0-4">CR 0-4</option>
                <option value="5-10">CR 5-10</option>
                <option value="11-16">CR 11-16</option>
                <option value="17+">CR 17+</option>
            </select>
        </div>
        <button id="generateBtn">Generate Treasure</button>
    </div>
    <div class="output" id="output">Results will appear here...</div>
    
    <!-- PLACEHOLDER BUTTON: Change href to your actual index URL later -->
    <div style="text-align: center; margin-top: 24px;">
        <a href="index.html" class="back-btn">← Back to Index</a>
    </div>
</div>

<script>
    // --- Dice & Math Utilities ---
    const roll = (n, d) => Array.from({length: n}, () => Math.floor(Math.random() * d) + 1).reduce((a,b) => a+b, 0);
    const rollDice = (formula, mult = 1) => {
        const m = formula.match(/(\d+)d(\d+)/i);
        return m ? roll(parseInt(m[1]), parseInt(m[2])) * mult : 0;
    };

    // --- Data Tables ---
    const IND_TABLES = {
        "0-4": [[1,30,"5d6 CP"],[31,65,"4d6 SP"],[66,95,"3d6 GP"],[96,100,"1d6 PP"]],
        "5-10": [[1,30,"4d6×100 CP + 1d6×10 SP"],[31,60,"10d6×10 SP"],[61,70,"3d6×10 GP"],[71,95,"4d6×10 GP"],[96,100,"2d6×10 GP + 3d6 PP"]],
        "11-16": [[1,20,"4d6x100 SP + 1d6x100 GP"],[21,35,"2d6x100 GP"],[36,75,"2d6x100 GP + 1d6x10 PP"],[76,100,"2d6x100 GP + 2d6x10 PP"]],
        "17+": [[1,15,"8d6x1000 SP + 8d6×100 GP"],[16,55,"1d6×1000 GP + 1d6×100 PP"],[56,100,"1d6×1000 GP + 2d6×100 PP"]]
    };

    const HOARD_COINS = {
        "0-4": "6d6×100 CP + 3d6×100 SP + 2d6×10 GP",
        "5-10": "2d6×100 CP + 2d6×1,000 SP + 6d6×100 GP + 3d6×10 PP",
        "11-16": "4d6×1,000 GP + 5d6×100 PP",
        "17+": "2d6×1,000 GP + 8d6×1,000 PP"
    };

    const HOARD_TABLES = {
        "0-4": [[1,6,0,""],[7,16,"2d6","A:1d6"],[17,26,"2d4","A:1d6"],[27,36,"2d6","A:1d6"],[37,44,"2d6","A:1d6"],[45,52,"2d4","A:1d6"],[53,60,"2d6","A:1d6"],[61,65,"2d6","A:1d4"],[66,70,"2d4","A:1d4"],[71,75,"2d6","A:1d4"],[76,78,"2d6","B:1d4"],[79,80,"2d4","B:1d4"],[81,85,"2d6","B:1d4"],[86,92,"2d4","B:1d4"],[93,97,"2d6","C:1d4"],[98,99,"2d4","C:1"],[100,100,"2d6","C:1"]],
        "5-10": [[1,4,0,""],[5,10,"2d6",""],[11,16,"3d6",""],[17,22,"3d6",""],[23,28,"2d4",""],[29,32,"2d4","A:1d6"],[33,36,"3d6","A:1d6"],[37,40,"3d6","A:1d6"],[41,44,"2d4","A:1d6"],[45,49,"2d4","A:1d4"],[50,54,"3d6","B:1d4"],[55,59,"3d6","B:1d4"],[60,63,"2d4","B:1d4"],[64,66,"2d4","B:1d4"],[67,69,"3d6","B:1d4"],[70,72,"3d6","C:1d4"],[73,74,"2d4","C:1d4"],[75,76,"2d4","C:1"],[77,78,"3d6","C:1"],[79,79,"3d6","C:1"],[80,80,"2d4","C:1"],[81,84,"2d4","D:1d4"],[85,88,"3d6","D:1d4"],[89,91,"3d6","D:1d4"],[92,94,"2d4","D:1d4"],[95,96,"3d6","D:1d4"],[97,98,"2d4","E:1d4"],[99,99,"3d6","E:1"],[100,100,"2d4","E:1"]],
        "11-16": [[1,3,0,""],[4,6,"2d4",""],[7,9,"2d4",""],[10,12,"3d6",""],[13,15,"3d6",""],[16,19,"2d4","A:1d4,B:1d6"],[20,23,"2d4","A:1d4,B:1d6"],[24,26,"3d6","A:1d4,B:1d6"],[27,29,"3d6","A:1d4,B:1d6"],[30,35,"2d4","C:1d6"],[36,40,"2d4","C:1d6"],[41,45,"3d6","C:1d6"],[46,50,"3d6","C:1d6"],[51,54,"2d4","C:1d4"],[55,58,"2d4","C:1d4"],[59,62,"3d6","D:1d4"],[63,66,"3d6","D:1d4"],[67,68,"2d4","D:1"],[69,70,"2d4","D:1"],[71,72,"3d6","D:1"],[73,74,"3d6","D:1"],[75,76,"2d4","D:1,E:1d4"],[77,78,"2d4","D:1,E:1d4"],[79,80,"3d6","D:1,E:1d4"],[81,82,"3d6","D:1,E:1d4"],[83,85,"2d4","E:1d4"],[86,88,"2d4","E:1d4"],[89,90,"3d6","E:1d4"],[91,92,"3d6","E:1d4"],[93,94,"2d4","F:1"],[95,96,"2d4","F:1"],[97,98,"3d6","F:1"],[99,100,"3d6","F:1"]],
        "17+": [[1,2,0,""],[3,5,"3d6","D:1d8"],[6,8,"1d10","D:1d8"],[9,11,"1d4","D:1d8"],[12,14,"1d8","D:1d8"],[15,22,"3d6","D:1d6"],[23,30,"1d10","D:1d6"],[31,38,"1d4","D:1d6"],[39,46,"1d8","D:1d6"],[47,52,"3d6","E:1d6"],[53,58,"1d10","E:1d6"],[59,63,"1d4","E:1d6"],[64,68,"1d8","E:1d6"],[69,69,"3d6","E:1d4"],[70,70,"1d10","E:1d4"],[71,71,"1d4","E:1d4"],[72,72,"1d8","E:1d4"],[73,74,"3d6","F:1d4"],[75,76,"1d10","F:1d4"],[77,78,"1d4","F:1d4"],[79,80,"1d8","F:1d4"],[81,85,"3d6","F:1d4"],[86,90,"1d10","F:1d4"],[91,95,"1d4","F:1d4"],[96,100,"1d8","F:1d4"]]
    };

    const MAGIC_TABLES = {
        A: [[1,68,"Common"],[69,69,"Special Good"],[70,85,"Common"],[86,86,"Special Bad"],[87,100,"Uncommon"]],
        B: [[1,68,"Common"],[69,69,"Special Good"],[70,85,"Uncommon"],[86,86,"Special Bad"],[87,100,"Rare"]],
        C: [[1,50,"Common"],[51,68,"Uncommon"],[69,69,"Special Good"],[70,85,"Uncommon"],[86,86,"Special Bad"],[87,100,"Rare"]],
        D: [[1,50,"Common"],[51,68,"Uncommon"],[69,69,"Special Good"],[70,85,"Rare"],[86,86,"Special Bad"],[87,95,"Rare"],[96,100,"Very Rare"]],
        E: [[1,68,"Uncommon"],[69,69,"Special Good"],[70,85,"Rare"],[86,86,"Special Bad"],[87,100,"Very Rare"]],
        F: [[1,68,"Uncommon"],[69,69,"Special Good"],[70,85,"Rare"],[86,86,"Special Bad"],[87,95,"Very Rare"],[96,100,"Legendary"]]
    };

    // --- Generation Logic ---
    function rollCoins(str) {
        const coins = {};
        const parts = str.split("+").map(s => s.trim());
        parts.forEach(p => {
            const m = p.match(/(\d+d\d+)(?:[×x]([\d,]+))?\s+(CP|SP|GP|PP)/i);
            if(m) {
                const dice = m[1];
                const mult = m[2] ? parseInt(m[2].replace(/,/g, ''), 10) : 1;
                const type = m[3].toUpperCase();
                coins[type] = (coins[type] || 0) + rollDice(dice, mult);
            }
        });
        return coins;
    }

    function applyCoinRarities(coins) {
        const result = {};
        for (const type of ['CP', 'SP', 'GP', 'PP']) {
            const count = coins[type] || 0;
            let antique = 0;
            let legendary = 0;
            for (let i = 0; i < count; i++) {
                const r = Math.floor(Math.random() * 1000) + 1;
                if (r === 1) legendary++;
                else if (r <= 3) antique++;
            }
            result[type] = { total: count, antique, legendary, normal: count - antique - legendary };
        }
        return result;
    }

    function getGemArt(quantity) {
        let items = [];
        for (let i = 0; i < quantity; i++) {
            const isGem = Math.random() < 0.75;
            if (isGem) {
                const d100 = Math.floor(Math.random() * 100) + 1;
                let base = d100<=25?10:d100<=50?50:d100<=70?100:d100<=90?500:d100<=99?1000:5000;
                let val = base;
                let d6 = Math.floor(Math.random() * 6) + 1;
                if (d6 === 1) {
                    while(d6 === 1 && val < 100000) {
                        base = base===10?50:base===50?100:base===100?500:base===500?1000:base===1000?5000:10000;
                        val = base;
                        d6 = Math.floor(Math.random() * 6) + 1;
                    }
                    val = base;
                } else if (d6 === 2) val = base * 2;
                else if (d6 === 3) val = Math.round(base * (1.1 + Math.random()*0.5));
                else if (d6 === 4) val = Math.round(base * (0.6 + Math.random()*0.3));
                else if (d6 === 5) val = Math.floor(base / 2);
                else if (d6 === 6) {
                    while(d6 === 6 && base > 10) {
                        base = base===10?0.5:base===50?10:base===100?50:base===500?100:base===1000?500:1000;
                        d6 = Math.floor(Math.random() * 6) + 1;
                    }
                    val = base;
                }
                if(val > 100000) val = 100000;
                items.push({type: "Gem", val});
            } else {
                const d100 = Math.floor(Math.random() * 100) + 1;
                let f = d100<=10?"1d10":d100<=25?"3d6x10":d100<=40?"1d6x100":d100<=50?"1d10x100":d100<=60?"2d6x100":d100<=70?"3d6x100":d100<=80?"4d6x100":d100<=85?"5d6x100":d100<=90?"1d4x1000":d100<=95?"1d6x1000":d100<=99?"2d4x1000":"2d6x1000";
                const m = f.match(/(\d+)d(\d+)(?:x(\d+))?/);
                let v = m ? roll(parseInt(m[1]), parseInt(m[2])) * (m[3]?parseInt(m[3]):1) : 0;
                items.push({type: "Art", val: v});
            }
        }
        return items;
    }

    function getMagicItems(ruleStr) {
        if (!ruleStr) return [];
        let items = [];
        const parts = ruleStr.split(",").map(s => s.trim());
        parts.forEach(p => {
            const m = p.match(/([A-F]):(\d+d\d+|\d+)/i);
            if (m) {
                const table = m[1];
                const times = m[2];
                const count = times.includes("d") ? rollDice(times) : parseInt(times);
                for(let i=0; i<count; i++) {
                    const d100 = Math.floor(Math.random()*100)+1;
                    const row = MAGIC_TABLES[table].find(r => d100>=r[0] && d100<=r[1]);
                    items.push(row ? row[2] : "Unknown");
                }
            }
        });
        return items;
    }

    function formatCoinLine(type, data) {
        if (data.total === 0) return "";
        let html = `<span class="coin">${data.total.toLocaleString()} ${type}</span>`;
        if (data.antique > 0 || data.legendary > 0) {
            html += ` <span class="rarity">(${data.antique} Antique, ${data.legendary} Legendary)</span>`;
        }
        return `<div class="line">${html}</div>`;
    }

    // --- UI Logic ---
    document.getElementById("treasureType").addEventListener("change", e => {
        document.getElementById("individualControls").classList.toggle("hidden", e.target.value !== "individual");
        document.getElementById("hoardControls").classList.toggle("hidden", e.target.value === "individual");
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
        const type = document.getElementById("treasureType").value;
        const out = document.getElementById("output");
        
        let html = "";
        if (type === "individual") {
            const count = Math.max(1, parseInt(document.getElementById("indCount").value) || 1);
            const cr = document.getElementById("indCR").value;
            const table = IND_TABLES[cr];
            const rawCoins = {CP:0, SP:0, GP:0, PP:0};
            
            for(let i=0; i<count; i++) {
                const d100 = Math.floor(Math.random()*100)+1;
                const row = table.find(r => d100>=r[0] && d100<=r[1]);
                if(row) {
                    const c = rollCoins(row[2]);
                    Object.keys(c).forEach(k => rawCoins[k] += c[k]);
                }
            }
            const coinData = applyCoinRarities(rawCoins);
            
            html = `<div class="summary">Individual Treasure (CR ${cr}) × ${count}</div><div class="section">`;
            html += formatCoinLine("CP", coinData.CP);
            html += formatCoinLine("SP", coinData.SP);
            html += formatCoinLine("GP", coinData.GP);
            html += formatCoinLine("PP", coinData.PP);
            html += html.includes("line") ? "" : `<div class="line"><em>No treasure found</em></div>`;
            html += "</div>";
        } else {
            const cr = document.getElementById("hoardCR").value;
            const coinStr = HOARD_COINS[cr];
            const d100 = Math.floor(Math.random()*100)+1;
            const row = HOARD_TABLES[cr].find(r => d100>=r[0] && d100<=r[1]);
            
            const rawCoins = rollCoins(coinStr);
            const coinData = applyCoinRarities(rawCoins);
            
            html = `<div class="summary">Treasure Hoard (CR ${cr}) | Table Roll: ${d100}</div>`;
            
            html += `<div class="section"><strong>Coins:</strong> `;
            let coinLines = [];
            if(coinData.CP.total) coinLines.push(formatCoinLine("CP", coinData.CP).replace('<div class="line">','').replace('</div>',''));
            if(coinData.SP.total) coinLines.push(formatCoinLine("SP", coinData.SP).replace('<div class="line">','').replace('</div>',''));
            if(coinData.GP.total) coinLines.push(formatCoinLine("GP", coinData.GP).replace('<div class="line">','').replace('</div>',''));
            if(coinData.PP.total) coinLines.push(formatCoinLine("PP", coinData.PP).replace('<div class="line">','').replace('</div>',''));
            html += coinLines.join(" ") || "<em>None</em>";
            html += `</div>`;

            if(row[2] && row[2] !== "0") {
                let qty = 0;
                if(row[2] === "1d4") qty = roll(1,4);
                else if(row[2] === "1d6") qty = roll(1,6);
                else if(row[2] === "1d8") qty = roll(1,8);
                else if(row[2] === "1d10") qty = roll(1,10);
                else if(row[2] === "2d4") qty = roll(2,4);
                else if(row[2] === "2d6") qty = roll(2,6);
                else if(row[2] === "3d6") qty = roll(3,6);
                else qty = 1;
                
                const ga = getGemArt(qty);
                let gems = ga.filter(g=>g.type==="Gem").map(g => `<span class="gem">${g.val.toLocaleString()} gp gem</span>`).join("<br>");
                let art = ga.filter(g=>g.type==="Art").map(g => `<span class="art">${g.val.toLocaleString()} gp art object</span>`).join("<br>");
                
                html += `<div class="section"><strong>Gems:</strong><br>${gems || "<em>None</em>"}</div>`;
                html += `<div class="section"><strong>Art Objects:</strong><br>${art || "<em>None</em>"}</div>`;
            } else {
                html += `<div class="section"><strong>Gems & Art:</strong> <em>None</em></div>`;
            }

            const magic = getMagicItems(row[3]);
            html += `<div class="section"><strong>Magic Items:</strong><br>`;
            html += magic.length ? magic.map(m => `<span class="magic">${m}</span>`).join("<br>") : "<em>None</em>";
            html += `</div>`;
        }
        out.innerHTML = html;
    });
</script>
</body>
</html>
