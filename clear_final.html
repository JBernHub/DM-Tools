<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Clearing Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --button-color: #03dac6;
            --button-text: #000000;
            --button-hover: #018786;
            --button-secondary: #cf6679;
            --button-secondary-hover: #b00020;
            --container-bg: #1e1e1e;
            --output-bg: #2d2d2d;
            --border-color: #444444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }

        .top-nav {
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: var(--button-color);
            color: var(--button-text);
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: var(--button-hover);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--button-secondary);
            color: #ffffff;
        }
        .btn-secondary:hover {
            background-color: var(--button-secondary-hover);
        }

        .controls {
            background: var(--container-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        input[type="number"] {
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 80px;
            font-size: 16px;
        }

        input[type="number"]:focus {
            outline: 2px solid var(--accent-color);
            border-color: transparent;
        }

        #output {
            background-color: var(--output-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            min-height: 200px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Color Coding Classes */
        .cat-grassland { color: #a5d6a7; }      /* Light Green */
        .cat-monster { color: #ff8a80; }        /* Red */
        .cat-abandoned { color: #ff8a80; }      /* Red */
        .cat-water { color: #81d4fa; }          /* Blue */
        .cat-forest { color: #4caf50; }         /* Dark Green */
        .cat-barren { color: #bcaaa4; }         /* Brown */
        .cat-mine { color: #cfd8dc; }           /* Light Gray (Default for Mines) */

        h1 {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        
        .report-header {
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .parcel-header {
            color: #ffffff;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="btn">← Return to Index</a>
    </div>

    <h1>Temperate Land Clearing Generator</h1>

    <div class="controls">
        <label for="parcelCount">Number of Parcels:</label>
        <input type="number" id="parcelCount" min="1" max="100" value="1">
        <button class="btn" onclick="generateParcels()">Generate Parcels</button>
        <button class="btn btn-secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
        <button class="btn btn-secondary" onclick="downloadTextFile()">Download as .txt</button>
    </div>

    <div id="output">Click "Generate Parcels" to see the results here.</div>

    <script>
        // --- Dice Rolling Helpers ---
        function rollD4() { return Math.floor(Math.random() * 4) + 1; }
        function rollD20() { return Math.floor(Math.random() * 20) + 1; }
        function rollD100() { return Math.floor(Math.random() * 100) + 1; }
        function roll2D10() { return rollD10() + rollD10(); }
        function rollD10() { return Math.floor(Math.random() * 10) + 1; }

        // --- Table Logic ---

        function getPlatinumCheck() {
            const roll = rollD100();
            if (roll === 69) return "Platinum = 1/100th copper yield";
            return "Nothing";
        }

        function resolveHighValueMine() {
            const roll = rollD100();
            if (roll >= 1 && roll <= 33) return `Two Mines/Quarries: ${resolveMineQuarry()} and ${resolveMineQuarry()}`;
            if (roll >= 34 && roll <= 56) return `Double Yield ${resolveMineQuarry()}`;
            if (roll >= 57 && roll <= 72) return `Triple Yield ${resolveMineQuarry()}`;
            if (roll >= 73 && roll <= 87) return "Common Gems";
            if (roll >= 88 && roll <= 97) return "Silver";
            if (roll === 98) return "Gold";
            if (roll === 99) return "Quality Gems";
            if (roll === 100) return "High Quality Gems";
        }

        function resolveMineQuarry() {
            const roll = rollD100();
            if (roll >= 1 && roll <= 6) return "Iron Mine";
            if (roll >= 7 && roll <= 11) return "Lead Mine";
            if (roll >= 12 && roll <= 14) return "Coal Mine";
            if (roll >= 15 && roll <= 16) return `Copper Mine (Platinum Check: ${getPlatinumCheck()})`;
            if (roll >= 17 && roll <= 18) return "Salt Mine";
            if (roll >= 19 && roll <= 20) return "Tin Mine";
            if (roll >= 21 && roll <= 44) return "Sandstone Quarry";
            if (roll >= 45 && roll <= 63) return "Limestone Quarry";
            if (roll >= 64 && roll <= 79) return "Granite Quarry";
            if (roll >= 80 && roll <= 91) return "Slate Quarry";
            if (roll >= 92 && roll <= 99) return "Marble Quarry";
            if (roll === 100) return `High Value Mine: ${resolveHighValueMine()}`;
        }

        function resolveForest() {
            const roll = rollD20();
            if (roll === 1) return `Mithril Trees (${rollD4()})`;
            if (roll >= 2 && roll <= 7) return "Evergreen Trees";
            if (roll >= 8 && roll <= 19) return "Deciduous Trees";
            if (roll === 20) return `Ent, plus ${resolveForest()}`; // Internally handles "Roll Again"
        }

        function getMonsterEncounter() {
            const rarityRoll = roll2D10();
            let rarity = "";
            if (rarityRoll === 2 || rarityRoll === 20) rarity = "Very Rare";
            else if ((rarityRoll >= 3 && rarityRoll <= 4) || (rarityRoll >= 18 && rarityRoll <= 19)) rarity = "Rare";
            else if ((rarityRoll >= 5 && rarityRoll <= 7) || (rarityRoll >= 15 && rarityRoll <= 17)) rarity = "Uncommon";
            else if (rarityRoll >= 8 && rarityRoll <= 14) rarity = "Common";
            
            const reactionRoll = rollD20();
            let reaction = "";
            if (reactionRoll === 1) reaction = "Hostile";
            else if (reactionRoll >= 2 && reactionRoll <= 6) reaction = "Unfriendly";
            else if (reactionRoll >= 7 && reactionRoll <= 14) reaction = "Neutral";
            else if (reactionRoll >= 15 && reactionRoll <= 19) reaction = "Friendly";
            else if (reactionRoll === 20) reaction = "Helpful";

            return `${rarity} (Roll: ${rarityRoll}), ${reaction} (Roll: ${reactionRoll})`;
        }

        function generateParcelFeatures() {
            let features = [];
            let keepRolling = true;
            let safetyCounter = 0; 
            
            while (keepRolling && safetyCounter < 20) {
                safetyCounter++;
                const roll = roll2D10();
                
                if (roll === 2) {
                    features.push({ category: 'monster', text: `Monster Encounter: ${getMonsterEncounter()}` });
                } else if (roll >= 3 && roll <= 4) {
                    features.push({ category: 'forest', text: `Forest: ${resolveForest()}` });
                } else if (roll >= 5 && roll <= 7) {
                    features.push({ category: 'water', text: "Water Feature" });
                } else if (roll >= 8 && roll <= 14) {
                    features.push({ category: 'grassland', text: "Grassland" });
                    keepRolling = false; // Terminates the chain
                } else if (roll >= 15 && roll <= 17) {
                    features.push({ category: 'barren', text: "Barren" });
                    keepRolling = false; // Terminates the chain
                } else if (roll >= 18 && roll <= 19) {
                    features.push({ category: 'mine', text: `Mine/Quarry: ${resolveMineQuarry()}` });
                    keepRolling = false; // Terminates the chain
                } else if (roll === 20) {
                    features.push({ category: 'abandoned', text: "Abandoned Buildings" });
                    // keepRolling remains true, so it loops again
                }
            }
            return features;
        }

        // --- Main Generator ---
        function generateParcels() {
            const count = parseInt(document.getElementById('parcelCount').value) || 1;
            let outputHTML = `<div class="report-header">Land Clearing Report (${count} Parcel${count > 1 ? 's' : ''})<br>`;
            outputHTML += `Generated on: ${new Date().toLocaleString()}</div>`;
            outputHTML += "=".repeat(50) + "\n\n";

            for (let i = 1; i <= count; i++) {
                outputHTML += `<div class="parcel-header">--- Parcel #${i} ---</div>`;
                const features = generateParcelFeatures();
                features.forEach(feature => {
                    outputHTML += `<span class="cat-${feature.category}">• ${feature.text}</span>\n`;
                });
                outputHTML += "\n";
            }

            document.getElementById('output').innerHTML = outputHTML;
        }

        // --- Export Functions ---
        function copyToClipboard() {
            const text = document.getElementById('output').innerText; // innerText gets plain text, stripping HTML tags
            navigator.clipboard.writeText(text).then(() => {
                alert("Results copied to clipboard!");
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert("Failed to copy to clipboard.");
            });
        }

        function downloadTextFile() {
            const text = document.getElementById('output').innerText; // innerText gets plain text, stripping HTML tags
            if (text.includes("Click \"Generate Parcels\"")) {
                alert("Please generate parcels first!");
                return;
            }
            const blob = new Blob([text], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "land_clearing_results.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
