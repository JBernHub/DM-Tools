<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Hub</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #111827;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #374151;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #111827 0%, var(--bg-color) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 850px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      font-size: 1.15rem;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .gen-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      color: var(--text-primary);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 0.875rem;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .gen-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, transparent, rgba(99, 102, 241, 0.1));
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .gen-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.25);
    }

    .gen-btn:hover::before {
      opacity: 1;
    }

    .gen-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .back-btn-container {
      margin-top: 1rem;
    }

    .back-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }

    @media (max-width: 640px) {
      h1 { font-size: 2rem; }
      .subtitle { font-size: 1rem; }
      .button-grid { grid-template-columns: 1fr; gap: 1rem; }
      .gen-btn { padding: 1.1rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Generator Hub</h1>
    <p class="subtitle">Select a tool to begin your adventure</p>
    
    <nav class="button-grid" aria-label="Generator tools">
      <!-- Replace href="#" with your actual file paths or URLs -->
      <a href="city_final.html" class="gen-btn">City Generator</a>
      <a href="merchant_final.html" class="gen-btn">Merchant Generator</a>
      <a href="npc_final.html" class="gen-btn">NPC Generator</a>
      <a href="trip_final.html" class="gen-btn">Trip Generator</a>
      <a href="treasure_final.html" class="gen-btn">Treasure Generator</a>
      <a href="time_final.html" class="gen-btn">Calendar</a>
      <a href="downtime_final.html" class="gen-btn">Downtime</a>
      <a href="clear_final.html" class="gen-btn">Clearing Land</a>
      <a href="dream.html" class="gen-btn">Memory</a>
      <a href="manor_final.html" class="gen-btn">Manors</a>
    </nav>

    <div class="back-btn-container">
      <a href="index.html" class="back-btn">← Back to Index</a>
    </div>
  </main>
</body>
</html>
