            "the decillionth of a nine hundred ninety nine nonillion nine hundred ninety nine octillion nine hundred ninety nine septillion nine hundred ninety nine sextillion nine hundred ninety nine quintillion nine hundred ninety nine quadrillion nine hundred ninety nine trillion nine hundred ninety nine billion nine hundred ninety nine million nine hundred ninety nine thousand nine hundred ninety nine decillionths", "the nine hundred ninety nine nonillion nine hundred ninety nine octillion nine hundred ninety nine septillion nine hundred ninety nine sextillion nine hundred ninety nine quintillion nine hundred ninety nine quadrillion nine hundred ninety nine trillion nine hundred ninety nine billion nine hundred ninety nine million nine hundred ninety nine thousand nine hundred ninety nine decillionths of a decillionth"
        ]
    };

    // --- TEMPLATES ---

    const mundaneTemplates = [
        "The mists clear to reveal a simple truth. I am {scene}. The air carries {sensory}. I feel {emotion}. Nearby, {figure} goes about their daily tasks. [VISION STABLE. ARCHIVING MUNDANE FRAGMENT.]",
        "A clear fragment surfaces from the dream. I am {scene}. I notice {sensory}. {emotion} settles over me as I watch {figure}. [MEMORY ARCHIVE: PEACEFUL. NO ANOMALIES DETECTED.]",
        "The aether ripples gently. I remember {scene}. {sensory} brings a sense of {emotion}. I see {figure} in the periphery. [RESONANCE HARMONIOUS. PROCEEDING.]"
    ];

    const anomalousTemplates = [
        "The mists part violently. I am {scene}. The air is thick with {sensory}. I feel {emotion}. Suddenly, {figure} emerges from the shadows. {corruption}",
        "Fragment recovered from the deep aether. {sensory} overwhelms the senses. I am standing beside {figure}, and I realize we are {scene}. {emotion} washes over me. {corruption}",
        "Arcane resonance failing. {figure} is speaking, but I only hear {sensory}. We are {scene}. I am consumed by {emotion}. {corruption}",
        "Deep mind delve. I remember {scene}. {sensory} triggers a cascade of {emotion}. {figure} is watching me from the treeline. {corruption}"
    ];

    const subjects = [
        "Captive of the Sunken Spire", "The Ashen Knight", "Exiled Seer of Oakhaven", 
        "Heretic Scholar", "Wandering Bard of the Lost Court", "The Hound of Valerius",
        "Miller's Daughter", "Veteran of the Border Wars", "Apprentice to the Alchemist"
    ];

    // --- LOGIC ---

    function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateSubjectID() {
        document.getElementById('subject-id').innerText = pick(subjects);
    }

    function typeWriter(text, element, speed = 25) {
        return new Promise(resolve => {
            let i = 0;
            element.innerHTML = "";
            
            function type() {
                if (i < text.length) {
                    let char = text.charAt(i);
                    
                    if (char === '[') {
                        let endBracket = text.indexOf("]", i);
                        if (endBracket !== -1) {
                            let corruptText = text.substring(i, endBracket + 1);
                            // If it contains specific keywords, make it red. Otherwise, keep it normal blue.
                            if (corruptText.includes("WARNING") || corruptText.includes("ERROR") || corruptText.includes("ALERT") || corruptText.includes("CORRUPTED") || corruptText.includes("DROPOUT")) {
                                element.innerHTML += `<span class="corruption">${corruptText}</span>`;
                            } else {
                                element.innerHTML += corruptText; // Normal system text
                            }
                            i = endBracket + 1;
                            setTimeout(type, speed);
                            return; 
                        }
                    }
                    
                    element.innerHTML += char;
                    i++;
                    setTimeout(type, speed);
                } else {
                    resolve();
                }
            }
            type();
        });
    }

    async function extractMemory() {
        const btn = document.getElementById('extract-btn');
        const output = document.getElementById('memory-output');
        const status = document.getElementById('status-text');
        const sync = document.getElementById('sync-status');

        btn.disabled = true;
        generateSubjectID();
        sync.innerText = "TETHERING...";
        status.innerText = "Bypassing mental wards and hexes...";
        
        await new Promise(r => setTimeout(r, 1500));
        
        sync.innerText = "SCRYING";
        status.innerText = "Sifting through the aether...";
        
        await new Promise(r => setTimeout(r, 1000));

        // --- THE 80/20 SPLIT ---
        // 20% chance (Math.random() < 0.20) to get an anomalous/weird memory
        let isAnomalous = Math.random() < 0.20; 
        
        let template, dataPool;

        if (isAnomalous) {
            template = pick(anomalousTemplates);
            dataPool = anomalousData;
            status.innerText = "Warning: Resonance spike detected...";
        } else {
            template = pick(mundaneTemplates);
            dataPool = mundaneData;
            status.innerText = "Filtering mundane life echoes...";
        }

        // Build the memory string
        let memory = template
            .replace("{sensory}", pick(dataPool.sensory))
            .replace("{scene}", pick(dataPool.scenes))
            .replace("{figure}", pick(dataPool.figures))
            .replace("{emotion}", pick(dataPool.emotions));

        // Only replace corruption if it's an anomalous memory (since mundane templates don't have the placeholder)
        if (isAnomalous) {
            memory = memory.replace("{corruption}", pick(dataPool.corruptions));
        }

        await typeWriter(memory, output, 20);

        sync.innerText = "DORMANT";
        status.innerText = "Vision faded. Awaiting next command.";
        btn.disabled = false;
    }

    generateSubjectID();
</script>
